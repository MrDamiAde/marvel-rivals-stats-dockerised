<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Marvel Rivals Characters</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-dark text-white">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Marvel Rivals</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/">Characters</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/about">About</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">
    <h1 class="text-center mb-4">Marvel Rivals Character Stats</h1>
    <div class="row g-4">
        {% for character in characters %}
        <div class="col-md-4">
            <a href="/character/{{ character[0] }}" style="text-decoration: none;">
                <div class="card h-100 text-dark">
                    <div class="card-body">
                        <h5 class="card-title">{{ character[0] }}</h5>
                        <p class="card-text"><strong>Health:</strong> {{ character[1] }}</p>
                        <p class="card-text"><strong>Speed:</strong> {{ character[2] }}</p>
                        <p class="card-text"><strong>Ability:</strong> {{ character[3] }}</p>
                    </div>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>

</body>
</html>
